name: Parser checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.10'
          enable-cache: true
      - run: uv sync --locked --python '${{ matrix.python }}'
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q
      - run: uv run --locked lead-parser --config config.example.yaml --check-config
      - run: uv run --locked lead-parser evaluate --config config.example.yaml --output reports/offline.json
      - run: uv run --locked python scripts/check_secrets.py
      - name: Build and smoke-test installed wheel outside checkout
        shell: bash
        run: |
          uv build
          parser_wheel_env="$(mktemp -d)"
          uv venv "$parser_wheel_env"
          uv pip install --python "$parser_wheel_env/bin/python" -r requirements.txt
          uv pip install --python "$parser_wheel_env/bin/python" --no-deps dist/*.whl
          parser_smoke_dir="$(mktemp -d)"
          cp config.example.yaml "$parser_smoke_dir/config.yaml"
          cd "$parser_smoke_dir"
          "$parser_wheel_env/bin/lead-parser" --check-config
          "$parser_wheel_env/bin/python" -m lead_parser evaluate --output evaluation.json
          "$parser_wheel_env/bin/python" - <<'PY'
          import json
          import sys
          from importlib.resources import files
          from pathlib import Path

          import lead_parser

          report = json.loads(Path("evaluation.json").read_text())
          assert Path(lead_parser.__file__).is_relative_to(sys.prefix)
          assert report["dataset_size"] >= 30
          assert report["prefilter"]["recall"] == 1
          assert report["pipeline"] is None
          assert files("lead_parser.resources").joinpath("evaluation.jsonl").is_file()
          assert not Path(".data").exists()
          PY
      - name: Verify exported runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --no-header --output-file /tmp/parser-requirements.txt > /dev/null
          diff requirements.txt /tmp/parser-requirements.txt
