name: Deploy tagged release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

# Finish an active deployment before starting another one.
concurrency:
  group: parser-production-deployment
  cancel-in-progress: false

jobs:
  release:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify tag, version and main ancestry
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release_gate.py --tag "$RELEASE_TAG" --sha "$GITHUB_SHA" > release.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("release.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={release['version']}\n")
          PY

  checks:
    needs: release
    uses: ./.github/workflows/checks.yml

  package:
    name: Build immutable release bundle
    needs: [release, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.10'
      - run: uv sync --locked --python 3.12
      - run: uv build --wheel
      - name: Bundle wheel and locked runtime requirements
        run: uv run --locked python scripts/build_release.py --wheel dist/*.whl --sha "$GITHUB_SHA" --output release.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parser-release
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to production
    needs: [release, package]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: parser-release
      - name: Transfer and activate the checked release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_CONFIG: ${{ vars.DEPLOY_CONFIG }}
          DEPLOY_PYTHON: ${{ vars.DEPLOY_PYTHON }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          python3 scripts/deploy_ssh.py --archive release.tar.gz --sha "$GITHUB_SHA" --version "$RELEASE_VERSION"
