# Все интеграции выключены. Включайте только настроенные источники.
# Относительные пути разрешаются от каталога этого YAML. Секреты — в .env.
general:
  city: Самара
  work_type: ремонт квартир под ключ
  keywords:
  - нужен ремонт
  - ищу бригаду
  exclude_keywords: []
telegram:
  enabled: false
  api_id: ''
  api_hash: ''
  session_name: .data/telegram
  channels: []
  messages_per_run: 200
  lookback_hours: 48
  max_concurrent_channels: 5
  max_messages_per_channel: 5000
  channel_timeout_seconds: 180
  channel_overrides: {}
vk:
  enabled: false
  access_token: ''
  token_mode: static
  token_file: vk_tokens.json
  state_file: vk_pkce_state.json
  client_id: '54797818'
  redirect_uri: https://oauth.vk.ru/blank.html
  api_version: '5.199'
  group_ids: []
  search_token: ''
  use_global_newsfeed_search: false
  posts_per_run: 100
  max_pages_per_query: 50
  max_age_hours: 48
  overlap_seconds: 300
  group_overrides: {}
  request_timeout_seconds: 30
avito:
  enabled: false
  city_slug: samara
  search_queries: []
  headless: true
  cdp_endpoint: ''
  max_listings_per_query: 50
  detail_limit: 50
  request_timeout_seconds: 30
  dolphin:
    enabled: false
    profile_id: ''
    local_api_url: http://127.0.0.1:3001
ai_filter:
  enabled: false
  openrouter_api_key: ''
  model: openai/gpt-4o-mini
  batch_size: 8
  min_confidence: 0.75
  max_text_chars: 12000
  timeout_seconds: 60
  max_attempts: 5
output:
  enabled: false
  mode: google_sheets
  google_sheets:
    credentials_file: service_account.json
    spreadsheet_id: ''
    worksheet_name: Лиды
    timeout_seconds: 30
notifications:
  telegram:
    enabled: false
    bot_token: ''
    chat_id: ''
    chat_ids: []
    timeout_seconds: 10
schedule:
  interval_minutes: 60
storage:
  database: .data/parser.sqlite3
  seen_store: seen_leads.json
  lock_file: .data/parser.lock
delivery:
  max_attempts: 8
  retry_base_seconds: 60
  retry_max_seconds: 3600
  lease_seconds: 300
  jobs_per_run: 100
discovery:
  city_id: null
  max_groups: 2000
  max_pages: 50
  days: 7
