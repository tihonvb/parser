[project]
name = "remont-lead-parser"
version = "0.2.0.dev0"
description = "Durable VK, Telegram and Avito lead collection"
requires-python = ">=3.12,<3.15"
dependencies = [
  "PyYAML>=6.0,<7", "telethon>=1.36,<2",
  "playwright>=1.45,<2", "requests>=2.32,<3", "gspread>=6.1,<7",
  "google-auth>=2.30,<3", "python-dotenv>=1,<2", "filelock>=3.19,<4",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project.scripts]
lead-parser = "lead_parser.interfaces.cli.entrypoint:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_parser"]

[tool.hatch.build.targets.sdist]
include = ["src/lead_parser", "pyproject.toml", "README.md", "LICENSE", "uv.lock"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
